name: Verified stock recommendations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recommendations.yml'
      - 'lib/recommendations/**'
      - 'scripts/recommend.mjs'
  schedule:
    # 16:35 New York; script selects the correct DST slot.
    - cron: '35 20,21 * * 1-5'
    # 08:20 Seoul, Monday-Friday. Execution can be delayed.
    - cron: '20 23 * * 0-4'
permissions:
  contents: write
concurrency:
  group: verified-stock-recommendations
  cancel-in-progress: false
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate recommendation logic
        run: node --test recommendations.test.js
      - name: Collect, replay, rank and notify
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/recommend.mjs
      - name: Preserve report and confirmed delivery state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/recommendations.json public/data/recommendations/
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified recommendation report [skip ci]'
            git pull --rebase origin main
            git push
          fi
